services:
  - type: web
    name: raw-smith-circle
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn raw_smith_circle.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "raw-smith-circle.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: raw-smith-db
          property: connectionString

databases:
  - name: raw-smith-db
    plan: free
